name: GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - "pardus-cihazimi-bul_*_amd64.deb"
      - "pardus-cihazimi-bul_*_amd64.deb.sha256"
      - "src/pardus_find/__init__.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish current version
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(python3 - <<'PY'
          import runpy
          print(runpy.run_path("src/pardus_find/__init__.py")["__version__"])
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify package
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          package="pardus-cihazimi-bul_${version}_amd64.deb"
          checksum="${package}.sha256"
          test -f "$package"
          test -f "$checksum"
          sha256sum --check "$checksum"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v${version}"
          package="pardus-cihazimi-bul_${version}_amd64.deb"
          checksum="${package}.sha256"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$package" "$checksum" --clobber
          else
            gh release create "$tag" \
              "$package" \
              "$checksum" \
              --target main \
              --title "Pardus Cihazımı Bul ${version}" \
              --notes "Pardus 25 amd64 için hazır kurulum paketi. Paketi indirip çift tıklayarak Pardus Paket Kurucu ile yükleyebilirsiniz."
          fi
